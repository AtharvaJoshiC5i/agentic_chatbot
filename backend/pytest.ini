[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose.jwt
markers =
    slow: downloads embedding model and indexes full corpus (deselect with -m "not slow")
    eval: full ground-truth evaluation harness (included in default suite via test_ground_truth_eval.py)
